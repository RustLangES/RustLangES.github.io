name: clippy
on:
  workflow_dispatch:
  pull_request:

  push:
    branches:
      - main
    paths-ignore:
      - "extras"
      - ".rusty-hook.toml"
      - ".github/workflows/**.yml"
      - "**/Makefile.toml"
      - "README.md"

jobs:
  fmt:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: "recursive"

      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-07-12
          targets: wasm32-unknown-unknown
          components: rustfmt

      - name: Set toolchain override
        run: rustup override set nightly-2025-07-12

      - name: Check formatting
        run: cargo fmt --all -- --check

  leptosfmt:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v2
      - uses: dtolnay/rust-toolchain@nightly
        with:
          profile: minimal
          toolchain: nightly
          override: true
          components: clippy
      - name: Cache .cargo and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
          key: ${{ runner.os }}-cargo-leptos-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-leptos-${{ hashFiles('**/Cargo.lock') }}
            ${{ runner.os }}-cargo-leptos
      - name: Install LeptosFmt
        run: cargo install leptosfmt --version 0.1.33
      - name: Check LeptosFmt
        run: leptosfmt --check src

  clippy:
    needs: [fmt, leptosfmt]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: "recursive"
      - uses: dtolnay/rust-toolchain@nightly
        with:
          profile: minimal
          toolchain: nightly
          override: true
          components: clippy

      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --features=ssr,hydrate -- -D warnings
